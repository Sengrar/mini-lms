<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mini LMS – Learn Web Development" />
  <meta name="author" content="Mini LMS Team" />

  <title>Mini LMS | Page Title</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css">

  <!-- Page Specific CSS -->
  <!-- <link rel="stylesheet" href="css/page.css"> -->
</head>
<body>

  <!-- Navbar -->
  <header id="navbar">
    <!-- navbar.html will be loaded here -->
  </header>

  <!-- Main Content -->
   <!-- login & signup-->
  <div class="auth-container">
  <h2>Welcome to LearnX</h2>
  <p class="subtitle">Login to your account</p>

  <!--  BUTTONS -->
  <div class="social-btn"> Continue with Google</div>
  <div class="social-btn">Continue with GitHub</div>
  <div class="social-btn">Continue with Microsoft</div>

  <div class="divider">or</div>

  <!-- AUTH FORM -->
  <form id="authForm">

    <!-- SIGNUP  -->
    <div id="nameFields" style="display: none;">
      <input type="text" id="firstName" placeholder="First Name" />
      <input type="text" id="lastName" placeholder="Last Name" />
    </div>

    <input type="email" id="email" placeholder="Email" />

    <div class="password-box">
      <input type="password" id="password" placeholder="Password" />
      <span id="togglePassword"></span>
    </div>

    <button type="submit">Continue</button>
  </form>

  <p class="switch">
    Don’t have an account?
    <span id="switchAuth">Sign up</span>
  </p>
</div>
  <!-- Footer -->
  <footer id="footer">
    <!-- footer.html will be loaded here -->
  </footer>

  <!-- Global JS -->
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>

  <!-- Page Specific JS -->
  <!-- <script src="js/page.js"></script> -->
</body>
</html>
