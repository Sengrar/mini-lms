<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mini LMS – Learn Web Development" />
  <meta name="author" content="Mini LMS Team" />

  <title>Mini LMS | Page Title</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Page Specific CSS -->
  <!-- <link rel="stylesheet" href="css/page.css"> -->
</head>

<body>

  <!-- Navbar -->
  <header id="navbar">
    <!-- navbar.html will be loaded here -->
  </header>

  <!-- Main Content -->
  <!-- login & signup-->
  <section class="page">
    <div class="auth-container">
      <h2>Welcome to LearnX</h2>
      <p class="subtitle">Create new account</p>

      <!--  BUTTONS -->
      <div class="social-btn"> Continue with Google</div>
      <div class="social-btn">Continue with GitHub</div>
      <div class="social-btn">Continue with Microsoft</div>

      <div class="divider">or</div>

      <!-- AUTH FORM -->
      <form id="signupForm">

        <input type="text" id="firstName" placeholder="First Name" required>
        <!-- <br><br> -->

        <input type="text" id="lastName" placeholder="Last Name" required>
        <!-- <br><br> -->

        <input type="email" id="email" placeholder="Email" required>
        <!-- <br><br> -->

        <input type="password" id="password" placeholder="Password" required>
        <!-- <br><br> -->

        <button id type="submit">Signup</button>
      </form>

      <p class="switch">Already have account? <a href="login.html">Login</a></p>

    </div>
  </section>
  <!-- Footer -->
  <footer id="footer">
    <!-- footer.html will be loaded here -->
  </footer>

  <!-- Global JS -->
  <script src="/js/main.js"></script>
  <script src="/js/register.js"></script>
  <script src="/js/navbar.js"></script>

  <!-- Page Specific JS -->
  <!-- <script src="js/page.js"></script> -->
</body>

</html>
